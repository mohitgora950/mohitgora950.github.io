<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="A dragon breathes fire and reveals the words I AM MOHIT GORA">
  <title>I am Mohit Gora</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04050a"/>
      <stop offset=".55" stop-color="#120b10"/>
      <stop offset="1" stop-color="#341509"/>
    </linearGradient>
    <radialGradient id="moonG" cx=".4" cy=".4" r=".7">
      <stop offset="0" stop-color="#f4f1e6"/>
      <stop offset="1" stop-color="#9aa6ad"/>
    </radialGradient>
    <radialGradient id="moonHalo">
      <stop offset="0" stop-color="#a9c6d3" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a9c6d3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset=".35" stop-color="#f3d58b"/>
      <stop offset=".7" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8a5418"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset=".12" stop-color="#ffe08a"/>
      <stop offset=".4" stop-color="#ff9a3c"/>
      <stop offset=".75" stop-color="#e2461a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#8a1a0a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#fff0b0"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wingG" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a0f0a"/>
      <stop offset=".55" stop-color="#3a0806"/>
      <stop offset="1" stop-color="#120303"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0c09"/>
      <stop offset="1" stop-color="#0c0303"/>
    </linearGradient>
    <linearGradient id="hornG" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2a1c12"/>
      <stop offset=".5" stop-color="#9c8462"/>
      <stop offset="1" stop-color="#f0e3c6"/>
    </linearGradient>
    <filter id="lavaGlow" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff8a3a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur6" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="textGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/>
      <feFlood flood-color="#ff6a1a" flood-opacity=".85"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="reveal"><rect class="reveal" x="400" y="80" width="800" height="140"/></clipPath>

    <style>
      .fly    { animation: flyIn 1.6s cubic-bezier(.2,.8,.25,1) both; }
      .bob    { animation: bob 3.2s ease-in-out 1.6s infinite; }
      .wingN  { transform-origin: 262px 140px; animation: flap .9s ease-in-out infinite; }
      .wingF  { transform-origin: 276px 132px; animation: flap .9s ease-in-out -.18s infinite; }
      .jaw    { transform-origin: 352px 128px; animation: jaw 7s ease-in-out 1.4s infinite; }
      .fire   { transform-origin: 420px 126px; transform: scaleX(0); opacity: 0; animation: breathe 7s ease-out 1.8s infinite; }
      .flick  { transform-origin: 420px 126px; animation: flick .14s ease-in-out infinite alternate; }
      .reveal { transform-origin: 400px 0; transform: scaleX(0); animation: reveal 1.05s cubic-bezier(.4,0,.6,1) 1.95s forwards; }
      .title  { animation: smoulder 2.8s ease-in-out 3.2s infinite; }
      .sub    { opacity: 0; animation: fadeUp 1s ease 3.1s forwards; }
      .cta    { opacity: 0; animation: fadeUp 1s ease 3.6s forwards, pulse 2.4s ease-in-out 4.6s infinite; }
      .glowF  { opacity: 0; animation: glowF 7s ease-out 1.8s infinite; }
      .flash  { opacity: 0; animation: lightning 9s linear 4s infinite; }
      .bolt   { opacity: 0; animation: lightning 9s linear 4s infinite; }
      .e      { animation: rise 6s linear infinite; }
      .s      { animation: fall 9s linear infinite; }
      .eye    { animation: eye 1.4s ease-in-out infinite alternate; }
      .lava   { animation: lava 1.8s ease-in-out infinite alternate; }
      .puff   { animation: puff 2.2s ease-out infinite; opacity: 0; transform-box: fill-box; transform-origin: center; }

      @keyframes flyIn   { from { transform: translate(-520px, 60px) rotate(-6deg); } to { transform: none; } }
      @keyframes bob     { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes flap    { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(-.42) skewX(-8deg); } }
      @keyframes jaw     { 0%,4% { transform: rotate(0); } 7%,30% { transform: rotate(20deg); } 36%,100% { transform: rotate(0); } }
      @keyframes breathe { 0% { transform: scaleX(0); opacity: 0; } 3% { opacity: 1; } 17% { transform: scaleX(1); opacity: 1; } 30% { transform: scaleX(1.03); opacity: 1; } 40% { transform: scaleX(1.06); opacity: 0; } 100% { transform: scaleX(0); opacity: 0; } }
      @keyframes flick   { from { transform: scaleY(.9); } to { transform: scaleY(1.12); } }
      @keyframes reveal  { to { transform: scaleX(1); } }
      @keyframes smoulder{ 0%,100% { opacity: 1; } 50% { opacity: .86; } }
      @keyframes fadeUp  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes pulse   { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
      @keyframes glowF   { 0% { opacity: 0; } 8%,30% { opacity: 1; } 42%,100% { opacity: 0; } }
      @keyframes lightning { 0%,90% { opacity: 0; } 91% { opacity: 1; } 92% { opacity: .2; } 93% { opacity: .9; } 96%,100% { opacity: 0; } }
      @keyframes rise    { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(-340px); opacity: 0; } }
      @keyframes fall    { from { transform: translate(0,0); } to { transform: translate(-60px, 360px); } }
      @keyframes eye     { from { opacity: .7; } to { opacity: 1; } }
      @keyframes lava    { from { opacity: .55; } to { opacity: 1; } }
      @keyframes puff    { 0% { opacity: 0; transform: translate(0,0) scale(.4); } 15% { opacity: .55; } 100% { opacity: 0; transform: translate(-26px,-40px) scale(1.8); } }
    </style>
  </defs>

  <!-- ===== Sky ===== -->
  <rect width="1200" height="320" fill="url(#sky)"/>
  <circle cx="1060" cy="70" r="110" fill="url(#moonHalo)"/>
  <circle cx="1060" cy="70" r="36" fill="url(#moonG)"/>
  <circle cx="1070" cy="76" r="7" fill="#7e8a92" opacity=".35"/>
  <circle cx="1048" cy="60" r="4.5" fill="#7e8a92" opacity=".35"/>
  <g fill="#2a2430" opacity=".55" filter="url(#blur6)">
    <ellipse cx="200" cy="40" rx="230" ry="26"/>
    <ellipse cx="760" cy="30" rx="260" ry="22"/>
    <ellipse cx="1110" cy="105" rx="150" ry="16"/>
  </g>

  <!-- lightning -->
  <polyline class="bolt" points="905,0 890,40 912,62 884,110 902,128 878,178" fill="none" stroke="#d6e8ff" stroke-width="2.4"/>
  <rect class="flash" width="1200" height="320" fill="#c8dcff" opacity="0" style="mix-blend-mode:screen" fill-opacity=".14"/>

  <!-- mountains & castles -->
  <path d="M0 230 L70 200 L130 214 L210 168 L290 206 L360 186 L450 222 L540 178 L640 210 L720 190 L820 226 L900 186 L1000 214 L1090 180 L1200 206 L1200 320 L0 320Z" fill="#120e13"/>
  <path d="M0 230 L70 200 L130 214 L210 168 L290 206 L360 186 L450 222 L540 178 L640 210 L720 190 L820 226 L900 186 L1000 214 L1090 180 L1200 206" fill="none" stroke="#a9c6d3" stroke-opacity=".14" stroke-width="1.5"/>
  <path d="M0 262 L90 240 L180 254 L280 232 L380 258 L470 238 L580 262 L680 236 L790 256 L880 240 L990 262 L1100 238 L1200 252 L1200 320 L0 320Z" fill="#0b090b"/>
  <g fill="#0b090b">
    <rect x="980" y="214" width="58" height="60"/><rect x="976" y="196" width="12" height="30"/><rect x="1030" y="190" width="12" height="36"/>
    <path d="M974 196 L982 182 L990 196Z M1028 190 L1036 174 L1044 190Z"/>
    <rect x="150" y="224" width="40" height="50"/><rect x="146" y="208" width="10" height="24"/><path d="M144 208 L151 196 L158 208Z"/>
  </g>
  <rect x="1002" y="228" width="5" height="8" fill="#ff9a4d" opacity=".8"/>
  <rect x="164" y="236" width="4" height="7" fill="#ff9a4d" opacity=".7"/>
  <rect y="290" width="1200" height="30" fill="#3a170c" opacity=".35"/>

  <!-- embers & snow -->
  <g fill="#ffb066">
    <circle class="e" cx="120" cy="320" r="1.8" style="animation-delay:0s"/>
    <circle class="e" cx="260" cy="320" r="1.3" style="animation-delay:-1.4s"/>
    <circle class="e" cx="430" cy="320" r="2" style="animation-delay:-3.1s"/>
    <circle class="e" cx="610" cy="320" r="1.5" style="animation-delay:-2.2s"/>
    <circle class="e" cx="780" cy="320" r="1.9" style="animation-delay:-4.4s"/>
    <circle class="e" cx="940" cy="320" r="1.4" style="animation-delay:-0.8s"/>
    <circle class="e" cx="1110" cy="320" r="1.7" style="animation-delay:-5.2s"/>
    <circle class="e" cx="700" cy="320" r="1.1" style="animation-delay:-3.8s"/>
  </g>
  <g fill="#dbeaf2" opacity=".7">
    <circle class="s" cx="80" cy="-10" r="1.3" style="animation-delay:-1s"/>
    <circle class="s" cx="340" cy="-10" r="1" style="animation-delay:-4s"/>
    <circle class="s" cx="560" cy="-10" r="1.4" style="animation-delay:-6s"/>
    <circle class="s" cx="860" cy="-10" r="1" style="animation-delay:-2.5s"/>
    <circle class="s" cx="1150" cy="-10" r="1.2" style="animation-delay:-7.5s"/>
  </g>

  <!-- ===== Title (revealed by fire) ===== -->
  <g clip-path="url(#reveal)">
    <g class="title" filter="url(#textGlow)">
      <text x="808" y="170" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', 'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-weight="800" font-size="62" letter-spacing="6" fill="url(#gold)">I AM MOHIT GORA</text>
    </g>
  </g>
  <text class="sub" x="808" y="214" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="6" fill="#c9bfa5">SOFTWARE ENGINEER · AI / ML · OPEN TO WORK</text>
  <text class="cta" x="808" y="262" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5" fill="#ff9a4d">▶ CLICK TO FLY THE DRAGON &amp; EXPLORE MY REPOS</text>

  <!-- ===== Dragon ===== -->
  <g transform="translate(-10,26) scale(.92)">
    <g class="fly">
      <g class="bob">
        <!-- fire glow -->
        <ellipse class="glowF" cx="640" cy="126" rx="420" ry="120" fill="url(#glow)"/>

        <!-- far wing (tattered) -->
        <g class="wingF">
          <path d="M276 132 L252 66 L290 12 L214 -30 Q206 4 156 -2 Q150 24 124 36 L132 52 L112 58 Q128 84 120 108 Q186 128 236 142Z" fill="#120303"/>
          <path d="M276 132 L252 66 L290 12 M290 12 L214 -30 M290 12 L156 -2 M290 12 L118 50 M290 12 L120 108" fill="none" stroke="#070101" stroke-width="3.4" stroke-linecap="round"/>
        </g>

        <!-- tail with axe blade -->
        <path d="M150 150 C110 150 80 170 50 196 C30 212 10 216 -16 214 L-14 222 C14 226 40 220 62 204 C90 184 116 168 160 166Z" fill="url(#bodyG)" stroke="#a02a14" stroke-opacity=".45" stroke-width="1"/>
        <path d="M-12 210 Q-30 188 -58 192 L-40 216 L-60 240 Q-30 244 -12 224Z" fill="#090202" stroke="#ff5a1a" stroke-opacity=".55" stroke-width="1.2"/>

        <!-- hind leg -->
        <path d="M166 162 C178 184 160 198 172 216 L184 216 C174 196 192 186 184 160Z" fill="#120505"/>
        <path d="M170 216 q-6 4 -9 12 M177 216 q0 6 -2 13 M184 216 q6 4 8 12" stroke="#e3d3b0" stroke-width="2.6" stroke-linecap="round" fill="none"/>

        <!-- body -->
        <path d="M352 114 C320 106 292 118 268 132 C236 150 200 150 160 148 C150 150 146 160 152 168 C190 176 240 178 270 162 C296 148 322 138 354 136Z" fill="url(#bodyG)" stroke="#b02c14" stroke-opacity=".55" stroke-width="1.2"/>
        <path d="M168 164 C200 172 240 172 266 158 C290 146 316 136 350 132" fill="none" stroke="#5a120a" stroke-opacity=".8" stroke-width="5" stroke-linecap="round"/>
        <!-- lava cracks -->
        <g class="lava" fill="none" stroke-linejoin="round" stroke-linecap="round">
          <polyline points="345,124 330,120 316,126 300,122 286,130 270,135 254,144 238,148 222,153 204,152 186,156 168,155 146,160 124,164 102,172 80,184 58,198 36,208 14,214" stroke="#ff4a10" stroke-width="6" opacity=".55" filter="url(#lavaGlow)"/>
          <polyline points="345,124 330,120 316,126 300,122 286,130 270,135 254,144 238,148 222,153 204,152 186,156 168,155 146,160 124,164 102,172 80,184 58,198 36,208 14,214" stroke="#ffc27a" stroke-width="1.6"/>
        </g>
        <!-- dorsal blades with burning tips -->
        <g fill="#060101"><path d="M343.0 110.0 Q334.4 94.0 326.0 79.0 L329.0 110.0Z"/><path d="M326.7 112.0 Q318.4 102.4 310.3 93.8 L313.3 112.0Z"/><path d="M310.5 117.0 Q302.5 102.3 294.5 88.7 L297.5 117.0Z"/><path d="M294.2 123.0 Q286.5 114.2 278.8 106.4 L281.8 123.0Z"/><path d="M277.9 130.0 Q270.5 116.7 263.1 104.3 L266.1 130.0Z"/><path d="M259.7 139.0 Q252.5 131.0 245.3 124.0 L248.3 139.0Z"/><path d="M239.4 146.0 Q232.6 134.0 225.6 123.0 L228.6 146.0Z"/><path d="M219.1 149.0 Q212.6 141.8 205.9 135.6 L208.9 149.0Z"/><path d="M198.9 149.0 Q192.6 138.3 186.1 128.7 L189.1 149.0Z"/><path d="M178.6 150.0 Q172.6 143.6 166.4 138.2 L169.4 150.0Z"/><path d="M156.3 153.0 Q150.7 143.7 144.7 135.3 L147.7 153.0Z"/><path d="M134.1 157.0 Q128.7 151.4 122.9 146.8 L125.9 157.0Z"/><path d="M109.8 165.0 Q104.7 157.0 99.2 150.0 L102.2 165.0Z"/><path d="M85.5 178.0 Q80.7 173.2 75.5 169.4 L78.5 178.0Z"/><path d="M61.3 194.0 Q56.8 187.3 51.7 181.7 L54.7 194.0Z"/><path d="M37.0 207.0 Q32.8 203.0 28.0 200.0 L31.0 207.0Z"/></g>
        <g class="lava" fill="#ff5a1a"><path d="M331.0 88.6 L326.0 79.0 L327.0 89.6Z"/><path d="M299.2 97.4 L294.5 88.7 L295.5 98.4Z"/><path d="M267.4 112.2 L263.1 104.3 L264.0 113.2Z"/><path d="M229.7 130.0 L225.6 123.0 L226.6 131.0Z"/><path d="M189.9 134.9 L186.1 128.7 L187.1 135.9Z"/><path d="M148.1 140.7 L144.7 135.3 L145.6 141.7Z"/><path d="M102.3 154.5 L99.2 150.0 L100.2 155.5Z"/><path d="M54.6 185.3 L51.7 181.7 L52.7 186.3Z"/></g>

        <!-- front leg -->
        <path d="M282 148 C294 170 280 184 292 200 L304 200 C294 182 308 172 298 144Z" fill="#120505"/>
        <path d="M290 200 q-6 4 -9 12 M297 200 q0 6 -2 13 M304 200 q6 4 8 12" stroke="#e3d3b0" stroke-width="2.6" stroke-linecap="round" fill="none"/>

        <!-- near wing (tattered, clawed) -->
        <g class="wingN">
          <path d="M262 140 L236 72 L274 16 L196 -28 Q190 8 138 2 Q134 28 108 40 L118 56 L94 62 Q114 88 104 116 Q170 134 214 150Z" fill="url(#wingG)" stroke="#a0200e" stroke-opacity=".35" stroke-width="1"/>
          <path d="M274 16 Q220 30 170 40 M274 16 Q210 60 150 84 M274 16 Q240 80 190 120" fill="none" stroke="#0a0101" stroke-opacity=".6" stroke-width="1.2"/>
          <path d="M262 140 L236 72 L274 16 M274 16 L196 -28 M274 16 L138 2 M274 16 L102 50 M274 16 L104 116" fill="none" stroke="#0a0202" stroke-width="4" stroke-linecap="round"/>
          <path d="M262 140 L236 72 L274 16" fill="none" stroke="#a02a14" stroke-opacity=".45" stroke-width="1.2"/>
          <g fill="#e3d3b0">
            <path d="M272 16 q16 -10 22 2 l-14 4Z"/>
            <path d="M196 -28 l-8 -8 l10 4Z"/><path d="M138 2 l-9 -6 l10 2Z"/><path d="M102 50 l-10 -3 l9 6Z"/>
          </g>
        </g>

        <!-- crown of horns -->
        <g fill="url(#hornG)" stroke="#140c06" stroke-width=".8">
          <path d="M362 104 C350 80 330 66 302 58 C322 72 340 90 350 112Z"/>
          <path d="M352 110 C334 96 314 90 290 92 C312 100 330 110 342 120Z"/>
          <path d="M346 124 C330 124 316 130 302 140 C318 136 332 134 346 132Z"/>
          <path d="M374 102 C372 92 366 84 358 80 C364 90 366 98 368 106Z"/>
        </g>

        <!-- lower jaw -->
        <g class="jaw">
          <path d="M348 128 L420 127 C424 130 420 135 413 136 L362 141 L344 137Z" fill="#170606" stroke="#a02a14" stroke-opacity=".5" stroke-width=".8"/>
          <g fill="#f2e9d6"><path d="M366 127 l2 -6 l2 6Z"/><path d="M375 127 l2 -5 l2 5Z"/><path d="M384 127 l2 -5 l2 5Z"/><path d="M393 127 l2 -5 l2 5Z"/><path d="M402 127 l2 -6 l2 6Z"/><path d="M411 127 l2 -9 l2 9Z"/></g>
          <path d="M356 140 L344 152 L366 141Z M372 139 L364 151 L380 139Z" fill="#060101"/>
        </g>

        <!-- skull -->
        <path d="M338 116 L352 103 L380 102 L404 108 L422 114 C428 117 426 122 420 124 L392 127 L352 132 L338 133Z" fill="url(#bodyG)" stroke="#c0361a" stroke-opacity=".6" stroke-width="1"/>
        <g fill="#060101"><path d="M392 107 l1 -7 l4 8Z"/><path d="M402 110 l1 -6 l4 7Z"/><path d="M412 113 l1 -5 l3 6Z"/></g>
        <g fill="#f2e9d6"><path d="M368 128 l2 6 l2 -6Z"/><path d="M378 127 l2 9 l2 -9Z"/><path d="M388 127 l2 5 l2 -5Z"/><path d="M398 126 l2 5 l2 -5Z"/><path d="M408 125 l2 5 l2 -5Z"/><path d="M416 124 l2 9 l2 -9Z"/></g>
        <path d="M362 103 L392 109 L388 113 L364 108Z" fill="#050101"/>
        <path d="M346 121 L326 114 L342 128Z M348 128 L330 134 L348 132Z" fill="#060101"/>
        <ellipse cx="418" cy="116" rx="2.2" ry="1.1" fill="#000"/>
        <g fill="#5a5250">
          <circle class="puff" cx="420" cy="112" r="5" style="animation-delay:0s"/>
          <circle class="puff" cx="420" cy="112" r="4" style="animation-delay:-.8s"/>
          <circle class="puff" cx="420" cy="112" r="6" style="animation-delay:-1.5s"/>
        </g>
        <g class="eye">
          <circle cx="380" cy="113" r="15" fill="#ff3a10" opacity=".45" filter="url(#blur6)"/>
          <path d="M370 114 Q379 107 390 111 Q380 118 370 114Z" fill="#ffcf3a"/>
          <path d="M373 114 Q380 109.5 387 111.4 Q380 116 373 114Z" fill="#ff5a1a"/>
          <ellipse cx="380.5" cy="112.8" rx=".8" ry="2.8" fill="#000"/>
        </g>

        <!-- fire -->
        <g class="fire">
          <g class="flick">
            <path d="M418 126 C520 96 650 78 880 74 C980 72 1110 88 1250 124 C1110 162 980 180 880 178 C650 174 520 156 418 128Z" fill="url(#flame)" filter="url(#blur6)"/>
            <path d="M418 126 C510 110 620 102 780 104 C860 106 940 114 1010 126 C940 140 860 148 780 150 C620 150 510 142 418 128Z" fill="url(#flameCore)" filter="url(#blur2)"/>
            <g fill="#ffcf7a">
              <circle cx="560" cy="96" r="5" opacity=".7"/><circle cx="700" cy="160" r="6" opacity=".6"/>
              <circle cx="860" cy="84" r="7" opacity=".5"/><circle cx="1000" cy="170" r="6" opacity=".45"/>
              <circle cx="1120" cy="104" r="5" opacity=".4"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
